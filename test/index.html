<title>Тест для родителей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый, простой, как тренер говорит с мамой у бровки
   IDEA: футбольное поле — каждый вопрос как шаг к воротам
   PICTURE: полоса поля с мячом, который катится к воротам по мере ответов
   COLOUR and TYPE: газонный зелёный, белая разметка, жёлтый акцент «ягуара»; Unbounded + Manrope
   LAYOUT: одна колонка, крупные кнопки-ответы под палец */
:root{color-scheme:light dark;--bg:light-dark(#eef1f6,#0d1526);--card:light-dark(#fff,#16213a);--ink:light-dark(#1b2a4a,#eef1f8);--mute:light-dark(#5b6b60,#9fb3a5);--g:#1b2a4a;--g2:#24385f;--y:#e3a23b;--line:light-dark(#dde2ec,#28365a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 40px}
.brand{text-align:center;margin:0 0 12px;background:#0b1222;border-radius:20px;padding:18px 12px}.brand img{height:160px;width:auto}
h1{font:800 clamp(26px,6vw,38px)/1.08 Unbounded,sans-serif;margin:0 0 10px;text-wrap:balance}
h2{font:600 clamp(20px,4.6vw,26px)/1.2 Unbounded,sans-serif;margin:0 0 18px;text-wrap:balance}
p{margin:0 0 14px}.mute{color:var(--mute)}
.pitch{position:relative;height:96px;border-radius:16px;background:repeating-linear-gradient(90deg,var(--g) 0 12.5%,var(--g2) 12.5% 25%);overflow:hidden;margin:0 0 18px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.pitch>svg:first-child{position:absolute;inset:0;width:100%;height:100%}
.ball{position:absolute;top:50%;left:6%;width:30px;height:30px;margin:-15px 0 0 -15px;transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.count{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.dots{display:flex;gap:6px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--y)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{min-height:56px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:16px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--y)}.opt:focus-visible,.cta:focus-visible,.ghost:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.opt.pick{border-color:var(--y);background:color-mix(in srgb,var(--y) 16%,transparent)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--y);color:#1a1400;font:800 16px Unbounded,sans-serif;text-decoration:none;padding:12px 16px;text-align:center}
.ghost{background:none;border:0;color:var(--mute);min-height:44px;padding:8px;font-weight:700;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;background:var(--y);color:#1a1400;font:800 13px Unbounded,sans-serif;padding:6px 12px;border-radius:99px;margin-bottom:12px}
.tip{border-left:4px solid var(--y);padding:4px 0 4px 14px;margin:16px 0}
ul.facts{padding-left:18px;margin:0 0 18px}ul.facts li{margin-bottom:6px}
.small{font-size:13px;color:var(--mute);text-align:center;margin-top:12px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){.ball{transition:none}}
</style>

<script>

const Q=[
 {q:"Сколько лет ребёнку?",a:[["3–4 года",{}],["5–6 лет",{}],["7 лет и старше",{}]]},

 {q:"Чего вы хотите от спорта в первую очередь?",a:[["Чтобы выплёскивал энергию",{E:2}],["Уверенности и смелости",{I:2}],["Дисциплины и характера",{L:1,S:1}],["Друзей и команду",{S:1,L:1}]]}

const R={
 E:{t:"Энерджайзер",h:"Ваш ребёнок готов — энергии хоть отбавляй",p:"Таким детям тяжело сидеть на месте, и это не проблема, а ресурс. Главное — направить энергию в игру с правилами.",l:["Много движения без скучных очередей","Короткие задания, которые меняются каждые 5–7 минут","Учится слушать тренера и ждать свой ход"],c:"На тренировках только короткие паузы, всё остальное время дети в игре. Мячей хватает на всех."},
 I:{t:"Осторожный исследователь",h:"Ваш ребёнок готов — ему просто нужно время",p:"Он сначала присматривается и включается, когда чувствует себя в безопасности. Давить нельзя — иначе спорт станет стрессом.",l:["Маленькая группа и спокойный старт","Можно первое время быть рядом","Через 2–3 занятия обычно появляется смелость"],c:"На пробном можно быть рядом. Если в первый раз он больше смотрит, чем играет, — это нормально."},
 L:{t:"Маленький лидер",h:"Ваш ребёнок готов — ему нужен вызов",p:"Он любит соревноваться и вести за собой. Без интересных задач ему быстро становится скучно.",l:["Игры на результат и командные задания","Роль капитана — по очереди, чтобы учился и уступать","Задачи чуть сложнее, чем он умеет"],c:"Будем развивать лидерские качества: научится брать ответственность и играть в команде. Впоследствии может стать капитаном."},
 S:{t:"Чувствительный игрок",h:"Ваш ребёнок готов — и спорт ему особенно полезен",p:"Он сильно переживает неудачи. Именно в игре проще всего научиться проигрывать и не сдаваться.",l:["Тренер хвалит за старание, а не только за гол","Проигрыш — часть игры, а не трагедия","Уверенность растёт через маленькие победы"],c:"На занятиях учимся справляться с проигрышами и формируем характер."}
};

const setBall=s=>ball.style.left=(6+s*16)+"%";

 const x=Q[i];

 setBall(i);
}
function finish(){
 const s={E:0,I:0,L:0,S:0};
 ans.forEach((k,qi)=>{const w=Q[qi].a[k][1];for(const t in w)s[t]+=w[t]});
